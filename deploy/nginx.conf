# Reverse proxy MarkUp: frontend Next.js (PM2, port 3000) + backend Django
# (Gunicorn, port 8000) di satu domain yang sama -- jadi gak perlu CORS lintas
# domain buat pemakaian normal aplikasi.
#
# Ganti "yourdomain.com" di bawah, lalu taruh file ini di
# /etc/nginx/sites-available/markup dan symlink ke sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/markup /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Setelah itu jalanin `sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com`
# -- certbot otomatis nambahin server block HTTPS (443) + redirect HTTP->HTTPS,
# jadi gak perlu ditulis manual di sini.
#
# RATE LIMITING (lapis pertahanan reverse proxy buat flood/DDoS aplikasi &
# brute-force): definisi zona-nya HARUS di http block, jadi ditaruh di file
# terpisah deploy/nginx-ratelimit.conf -> salin ke /etc/nginx/conf.d/ (Ubuntu
# nginx.conf udah `include /etc/nginx/conf.d/*.conf` di dalam http block):
#   sudo cp deploy/nginx-ratelimit.conf /etc/nginx/conf.d/markup-ratelimit.conf

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 20M;  # cukup buat upload bukti bayar/CV/sertifikat

    # X-Forwarded-For sengaja pakai $remote_addr (NIMPA), bukan
    # $proxy_add_x_forwarded_for (NAMBAH). Yang versi "nambah" nyimpen nilai
    # kiriman klien di depan lalu nempelin IP asli di belakang -- artinya
    # klien ikut ngisi header itu. Django baca header ini buat rate limit &
    # audit log, jadi kalau klien bisa ngarang isinya, limit per-IP gampang
    # dilewatin cuma dengan ngacak header tiap request.
    #
    # Kalau nanti ada CDN di depan Nginx, IP asli pindah ke header khusus
    # CDN-nya dan get_client_ip() di Backend/accounts/utils.py harus ikut
    # disesuaikan.

    # Batasi jumlah koneksi bareng per IP -- ngerem connection-flood, angkanya
    # longgar biar user normal (banyak tab, prefetch) gak keblokir.
    limit_conn markup_conn 50;

    location /static/ {
        alias /var/www/markup/Backend/staticfiles/;
    }

    # /media/ SENGAJA DITUTUP TOTAL.
    #
    # Isinya berkas pribadi milik user: bukti pembayaran, CV, dokumen
    # pendaftaran bootcamp, sertifikat. Dulu folder ini disajikan apa adanya
    # sebagai fallback buat file lama, tapi itu artinya siapa pun yang nebak
    # path (nama file aslinya dipertahankan, polanya cuma
    # /media/payment_proofs/TAHUN/BULAN/namafile) bisa ngunduh dokumen orang
    # lain tanpa login sama sekali. Perintah backup_database juga nulis dump
    # PostgreSQL ke storage yang sama -- jadi seluruh database ikut kebuka.
    #
    # Jalur yang benar buat berkas user adalah object storage private +
    # presigned URL yang kedaluwarsa (settings.py, USE_S3_STORAGE).
    #
    # CATATAN MIGRASI: berkas lama yang sempat ke-upload ke folder lokal ini
    # jadi nggak bisa diakses lagi setelah blok ini aktif. Pindahin dulu ke
    # object storage (atau terima bahwa link lamanya mati) -- jangan dibuka
    # lagi cuma biar link lama jalan.
    location /media/ {
        deny all;
        return 404;
    }

    location /api/ {
        # Maks 10 req/detik per IP, boleh nyembur (burst) sampai 20 -- request
        # dinamis yg mahal (nembak DB/Gunicorn). Flood di atas ini ditolak 429
        # di level nginx, gak sampe ngebebanin Django.
        limit_req zone=markup_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin bawaan Django (bukan dashboard admin custom -- itu di /admin
    # lewat frontend Next.js, location / di bawah).
    location /django-admin/ {
        limit_req zone=markup_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
